<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McDonald's Philippines</title>
</head>

<body>

    <header>
        <div>
            <img src="mcdo-logo.jpg" alt="McDonald's Logo" width="80">
        </div>

        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="#">Family Activities</a></li>
                <li><a href="#">McDelivery</a></li>
                <li><a href="#">Careers</a></li>
                <li><a href="#">Opportunities</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section id="hero">
            <figure>
                <img src="hero-banner.jpg" alt="McDo Banner" width="1000">
            </figure>
        </section>

        <section id="featured">
            <article>
                <figure>
                    <img src="delivery.jpg" alt="McDelivery" width="200">
                    <figcaption>McDelivery</figcaption>
                </figure>
            </article>

            <article>
                <figure>
                    <img src="nxtgen.jpg" alt="NXTGEN" width="200">
                    <figcaption>NXTGEN</figcaption>
                </figure>
            </article>

            <article>
                <figure>
                    <img src="careers.jpg" alt="Careers" width="200">
                    <figcaption>Careers</figcaption>
                </figure>
            </article>

            <article>
                <figure>
                    <img src="family.jpg" alt="Family Activities" width="200">
                    <figcaption>Family Activities</figcaption>
                </figure>
            </article>

            <article>
                <figure>
                    <img src="app.jpg" alt="McDelivery App" width="200">
                    <figcaption>McDelivery App</figcaption>
                </figure>
            </article>

            <article>
                <figure>
                    <img src="charity.jpg" alt="Charity" width="200">
                    <figcaption>Charity</figcaption>
                </figure>
            </article>
        </section>

    </main>

    <footer>
        <section>
            <div>
                <img src="mcdelivery-logo.jpg" alt="McDelivery Logo" width="70">

                <a href="#">
                    <img src="google-play.jpg" alt="Google Play" width="120">
                </a>

                <a href="#">
                    <img src="app-store.jpg" alt="App Store" width="120">

            <div>

                    <li><a href="#">Privacy Policy</a></li>
                    <li><a href="#">Our Food</a></li>

            </div>

            <div>
                <ul>
                    <li><a href="#">About Us</a></li>
                    <li><a href="#">Careers</a></li>
                    <li><a href="#">Menu</a></li>
                    <li><a href="#">Family Activities</a></li>
                </ul>
            </div>

            <div>
                <h4>Follow us on</h4>
                <ul>
                    <li><a href="#">Facebook</a></li>
                    <li><a href="#">Instagram</a></li>
                    <li><a href="#">Twitter</a></li>
