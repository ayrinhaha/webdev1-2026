<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <!-- part 1 -->
        <div class="quote-card">
            <blockquote>
                "The best way to learn CSS is to break things and rebuild them."
                <cite>&mdash; A WISE DEVELOPER</cite>
            </blockquote>
        </div>

        <!-- part 2 -->
        <div class="stats">
            <div class="stat">
                <span class="num"> 128</span>
                <span class="label"> PROJECTS</span>
            </div>

            <div class="stat">
                <span class="num"> 4.9★</span>
                <span class="label"> RATING</span>
            </div>
            <div class="stat">
                <span class="num"> 99%</span>
                <span class="label"> UPTIME</span>
            </div>
        </div>



        <!-- part 3 -->
        <div class="field">
            <label for="email">EMAIL ADDRESS</label>
            <input type="email" id="email" placeholder="you@example.com" required>
            <span class="helper">We'll never share your email.</span>
        </div>


        <!-- part 4 -->
        <div class="banner">
            <h2>Make it Beautiful</h2>
            <p>CSS Gradients can be applied to text, not just backgrounds</p>
        </div>

        <!-- part 5 -->
        <div class="price-card">
            <p class="plan-label">Premium Plan</p>
            <p class="old-price">₱2,400/yr</p>
            <p class="new-price">₱1,200/yr</p>
            <span class="save-badge">Save 20%</span>
        </div>




    </main>
</body>

</html>
